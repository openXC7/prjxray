name: Tests

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -qq -y \
            bash bison build-essential ca-certificates clang-format cmake psmisc \
            colordiff coreutils git flex python3 python3-dev python3-venv xsltproc \
            libtinfo6

      - name: Build
        run: make build --output-sync=target --warn-undefined-variables -j"$(nproc)"

      - name: Environment
        run: make env --output-sync=target --warn-undefined-variables

      - name: Test
        run: make test --output-sync=target --warn-undefined-variables

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          if-no-files-found: warn
          path: |
            build/py_test_results.xml
            build/cpp_test_results.xml
            build/Testing/**/Test.xml
