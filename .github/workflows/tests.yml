name: Tests

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -qq -y \
            bash bison build-essential ca-certificates clang-format cmake psmisc \
            colordiff coreutils git flex python3 python3-dev python3-venv xsltproc \
            libtinfo6

      - name: Build
        run: make build --output-sync=target --warn-undefined-variables -j"$(nproc)"

      - name: Environment
        run: make env --output-sync=target --warn-undefined-variables

      - name: Test
        run: make test --output-sync=target --warn-undefined-variables

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          if-no-files-found: warn
          path: |
            build/py_test_results.xml
            build/cpp_test_results.xml
            build/Testing/**/Test.xml

  pip-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Install the package the way users do, in a clean venv and without
      # the repo root on PYTHONPATH, and check that the console scripts start
      # and print their usage.
      - name: Install with pip and run the console scripts
        run: |
          set -eu
          cd "$RUNNER_TEMP"
          for mode in regular editable compat; do
            python3 -m venv "venv-$mode"
            case "$mode" in
              regular) "venv-$mode/bin/pip" install "$GITHUB_WORKSPACE" ;;
              editable) "venv-$mode/bin/pip" install -e "$GITHUB_WORKSPACE" ;;
              compat) "venv-$mode/bin/pip" install -e "$GITHUB_WORKSPACE" \
                  --config-settings editable_mode=compat ;;
            esac
            for tool in fasm2frames bit2fasm; do
              "venv-$mode/bin/$tool" --help > "help-$mode-$tool.txt"
              grep -q "^usage: $tool" "help-$mode-$tool.txt"
            done
          done

  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Only the libraries the C++ tools are built from.
      - name: Checkout submodules
        run: |
          git submodule update --init --depth 1 \
            third_party/abseil-cpp third_party/gflags \
            third_party/googletest third_party/yaml-cpp

      # Build the C++ tools and tests with AddressSanitizer and
      # UndefinedBehaviorSanitizer, so that memory errors and undefined
      # behaviour fail the job instead of going unnoticed.
      - name: Build with sanitizers
        run: |
          flags="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined"
          cmake -S . -B build-sanitizers -DPRJXRAY_BUILD_TESTING=ON \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_FLAGS="$flags" -DCMAKE_CXX_FLAGS="$flags" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-sanitizers -j"$(nproc)"

      - name: Run the tests with sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-sanitizers --output-on-failure

      - name: Run the tools with sanitizers
        run: .github/scripts/sanitize-tools.sh build-sanitizers
