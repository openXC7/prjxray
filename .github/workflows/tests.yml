name: Tests

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -qq -y \
            bash bison build-essential ca-certificates clang-format cmake psmisc \
            colordiff coreutils git flex python3 python3-dev python3-venv xsltproc \
            libtinfo6

      - name: Build
        run: make build --output-sync=target --warn-undefined-variables -j"$(nproc)"

      - name: Environment
        run: make env --output-sync=target --warn-undefined-variables

      - name: Test
        run: make test --output-sync=target --warn-undefined-variables

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          if-no-files-found: warn
          path: |
            build/py_test_results.xml
            build/cpp_test_results.xml
            build/Testing/**/Test.xml

  pip-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Install the package the way users do, in a clean venv and without
      # the repo root on PYTHONPATH, and check that the console scripts start.
      - name: Install with pip and run the console scripts
        run: |
          set -eu
          cd "$RUNNER_TEMP"
          for mode in regular editable compat; do
            python3 -m venv "venv-$mode"
            case "$mode" in
              regular) "venv-$mode/bin/pip" install "$GITHUB_WORKSPACE" ;;
              editable) "venv-$mode/bin/pip" install -e "$GITHUB_WORKSPACE" ;;
              compat) "venv-$mode/bin/pip" install -e "$GITHUB_WORKSPACE" \
                  --config-settings editable_mode=compat ;;
            esac
            "venv-$mode/bin/fasm2frames" --help
          done
